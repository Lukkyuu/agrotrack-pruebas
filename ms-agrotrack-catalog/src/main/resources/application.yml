server:
  port: 8082

spring:
  application:
    name: ms-agrotrack-catalog
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:agrotrack_catalog;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    url: jdbc:oracle:thin:@//CAMBIAR-HOST:1521/CAMBIAR-SERVICE_NAME
    driver-class-name: oracle.jdbc.OracleDriver
    username: CAMBIAR_USUARIO
    password: CAMBIAR_PASSWORD
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
